name: Daily picks

on:
  schedule:
    # GitHub starts scheduled runs late (often 2-3 hours) and sometimes skips them, so the
    # workflow wakes up 4 times a day and scripts/wait_and_run.py waits for the right moment:
    # build 2.5 h before today's first tip, final refresh 1 h before. Steps already done are skipped.
    # UTC 11:07 / 14:07 / 17:07 / 20:07 = 7:07am / 10:07am / 1:07pm / 4:07pm Eastern (summer time).
    - cron: "7 11,14,17,20 * * *"
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # a wake-up may wait several hours for the right moment
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data sources
        run: python scripts/probe_sources.py

      - name: Build today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/wait_and_run.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}

      - name: Save database, history and dashboard
        if: always()
        run: |
          git config user.name "nba-prop-engine"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Picks for $(TZ=America/New_York date +%F)"
          git pull -q --rebase -X theirs || true
          git push || true
