name: Daily picks

on:
  schedule:
    # 21:13 UTC = 5:13pm Eastern (4:13pm in winter). Late enough for most injury
    # news and posted prop lines, early enough before 7pm tip-offs.
    - cron: "13 21 * * *"
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data sources
        run: python scripts/probe_sources.py

      - name: Probe ESPN prop lines (temporary)
        continue-on-error: true
        run: python scripts/probe_props.py

      - name: Build today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily.py

      - name: Save database, history and dashboard
        if: always()
        run: |
          git config user.name "nba-prop-engine"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Picks for $(TZ=America/New_York date +%F)"
          git push
