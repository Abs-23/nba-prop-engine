name: Daily picks

on:
  schedule:
    # GitHub often starts scheduled runs 2-3 hours late, so run three times a day.
    # UTC 15:47 / 18:47 / 20:47 = 11:47am / 2:47pm / 4:47pm Eastern (an hour earlier in winter).
    # Each run before the first tip-off refreshes the cards with the latest injury news and
    # lines; once a game has started, the cards are locked.
    - cron: "47 15,18,20 * * *"
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data sources
        run: python scripts/probe_sources.py

      - name: Build today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_daily.py

      - name: Save database, history and dashboard
        if: always()
        run: |
          git config user.name "nba-prop-engine"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Picks for $(TZ=America/New_York date +%F)"
          git push
