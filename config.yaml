# NBA Prop Engine — settings you can tune without touching code.
# Every number here is a deliberate rule. Change one, and the dashboard's
# track record will tell you whether it helped.

model:
  rate_half_life_games: 15        # how fast old games fade when estimating per-minute production
  minutes_half_life_games: 5      # minutes react faster (role changes show up quickly)
  prior_season_weight: 0.5        # a last-season game counts half as much as a this-season game
  minutes_prior_games: 5          # early season: blend this many "virtual" games of last-season minutes
  opponent_shrink_games: 15       # opponent defense numbers are noisy; shrink toward average until this many games
  opponent_factor_clamp: [0.90, 1.10]
  back_to_back_minutes_factor: 1.0   # backtest: starters lost no minutes on back-to-backs
  dispersion_prior_games: 10      # how much to trust a player's own volatility vs league-typical volatility

gates:                             # a pick must pass ALL of these to be shown
  min_games_sample: 15            # games in the player's history (both seasons)
  min_projected_minutes: 24
  max_minutes_cv: 0.30            # skip players whose minutes swing wildly (coefficient of variation, last 10)
  min_games_with_team: 3          # traded/signed players: wait until we've seen their new role
  role_change:                    # early season: skip players whose minutes changed a lot vs last season
    until_games: 10               # applies until a player has this many games this season
    min_change: 6                 # minutes difference that counts as a role change...
    pct_change: 0.25              # ...or this share of last season's minutes, whichever is bigger
  exclude_injury_statuses: ["out", "doubtful", "questionable", "day-to-day"]

market_picks:                      # picks against a real sportsbook line
  # Sportsbook lines are sharp. Picking the spots where our model disagrees most
  # with the market also picks the spots where our model is most wrong. So the
  # final probability blends the two: 35% model, 65% market. (In simulation this
  # weight made the predicted and actual hit rates match. Tune it from the track record.)
  model_weight: 0.35
  min_prob: 0.55                  # blended probability
  min_edge: 0.04                  # blended probability minus the books' fair (no-vig) probability
  min_l10_hit_rate: 0.60
  min_books: 2                    # the line must be posted by at least this many books
  lock_prob: 0.58                 # "Lock" tier
  lock_l20_hit_rate: 0.65
  lock_edge: 0.06

safe_thresholds:                   # "X+" picks for any stat, including ones books rarely post (FTA, FGA, 3PA)
  min_model_prob: 0.85
  min_l20_hit_rate: 0.85
  min_threshold:                  # don't bother with trivial picks like "1+ assist"
    pts: 12
    reb: 5
    ast: 4
    fg3m: 2
    fg3a: 5
    fga: 10
    fgm: 5
    ftm: 3
    fta: 4
    pra: 22
    pr: 18
    pa: 16
    ra: 8

matchups:
  # Every stat has its own matchup checks (see engine/matchups.py). Their weights are
  # re-learned from the box scores on every run. A check only counts if, in past games,
  # it clearly predicted results AND pointed the way basketball sense says it should.
  fit_min_t: 1.5
  # A pick needs the matchup (incl. teammates/opponents out and minutes) to lean its way by
  # at least this much. Safe lines are set from the player's own numbers; the matchup is cushion.
  # Backtest (3 test periods, last season), Safe picks:
  #   this rule: 88.9-90.4% hit, ~29-38/day    original engine: 86.5-87.0%, ~95/day
  min_net_effect: 0.01
  # Checks with weight 0 (e.g. opponent height, opponent fouls) are still shown as context.
  show_context_min_effect: 0.03

card:
  # Two cards a night, 3 to 6 props each, at the real DraftKings line (lines via ESPN, free).
  # Backtest at real DraftKings closing lines (last season, 46 days, mostly April + playoffs).
  # Neither card beat DraftKings on profit by more than noise (about +-2% per leg): they pick
  # the best-supported legs and show honest odds. The live track record is the real test.
  min_legs: 3
  max_legs: 6
  max_per_game: 2
  cards:
    likely:                 # "Most likely": highest chance, any price. Backtest: legs hit ~67% at ~-175.
      title: "Most likely"
      p_min: 0.58           # blended chance the leg hits
      form_min: 0.7         # cleared this exact line in 7+ of last 10
      lean_min: 0.0         # matchup must not lean against the pick
      price_min: null       # no price limit
      max_gap: 0.10         # model may be at most 10 pts more confident than DraftKings.
                            # Backtest: gap <=10 pts hit 72.6% (146 legs) vs 66.5% for all legs
      fill_p_min: 0.55      # if fewer than 3 qualify, fill with legs above these (marked "below bar")
      fill_form_min: 0.6
    fair:                   # "Fair price": every leg -150 or better. Backtest: legs hit ~57% at ~-126.
      title: "Fair price"
      p_min: 0.52
      form_min: 0.6
      lean_min: 0.01
      price_min: -150
      max_gap: 0.20         # Backtest: legs with model >20 pts above DraftKings hit only 47.6% (170 legs)
      fill_p_min: 0.50
      fill_form_min: 0.5
  # Blend of model and market, learned from real lines + results (scripts/backtest_lines.py):
  # logit(p) = b0 + b1 * logit(model) + b2 * logit(DraftKings no-vig)
  blend: [-0.000, 0.108, 0.894]

lineups:
  sizes: [3, 4, 5, 6]
  max_legs_per_game: 2            # legs from the same game move together; cap the exposure
  max_legs_per_team: 1

odds_api:
  regions: "us"
  # Ordered by priority. When credits are tight, markets at the end are dropped first.
  markets:
    - player_points
    - player_rebounds
    - player_assists
    - player_points_rebounds_assists
    - player_threes
    - player_frees_made
    - player_frees_attempts
    - player_field_goals
  reserve_credits: 10             # never spend the last few credits
  max_daily_credits: 400          # hard cap per run even on a paid plan
